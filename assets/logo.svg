<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="50%" stop-color="#101524" />
      <stop offset="100%" stop-color="#05070C" />
    </linearGradient>

    <!-- Forensic Aegis Shield Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="threat-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Forensic Reticle & Timeline Graph Mesh -->
  <g opacity="0.16" stroke="#06B6D4" stroke-width="1.5">
    <circle cx="400" cy="380" r="140" fill="none" stroke-dasharray="6 6" />
    <circle cx="400" cy="380" r="230" fill="none" stroke-dasharray="8 8" />
    <line x1="400" y1="100" x2="400" y2="660" stroke-dasharray="4 8" />
    <line x1="120" y1="380" x2="680" y2="380" stroke-dasharray="4 8" />
  </g>

  <!-- Aegis DFIR Defense Shield (Main Hero Frame) -->
  <path d="M 400 160 
           L 570 240 
           C 570 420, 480 540, 400 600 
           C 320 540, 230 420, 230 240 
           Z" 
        fill="url(#threat-glow)" 
        stroke="url(#shield-grad)" 
        stroke-width="10" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Memory Volatility / Discrepancy Diffing Geometry (Inner Forensic Core) -->
  <!-- Stylized Forensic Cyber Skull / Analysis Core -->
  <g filter="url(#subtle-glow)">
    <!-- Cranium / Upper Shield Vault -->
    <path d="M 330 320 
             C 330 260, 470 260, 470 320 
             C 470 350, 450 370, 450 400 
             L 350 400 
             C 350 370, 330 350, 330 320 Z" 
          fill="#111827" 
          stroke="#EF4444" 
          stroke-width="4" />

    <!-- Eye Sockets (Binary Anomaly Focal Points) -->
    <circle cx="365" cy="330" r="16" fill="#0B0F17" stroke="#06B6D4" stroke-width="3" />
    <circle cx="435" cy="330" r="16" fill="#0B0F17" stroke="#06B6D4" stroke-width="3" />
    <circle cx="365" cy="330" r="6" fill="#22D3EE" />
    <circle cx="435" cy="330" r="6" fill="#22D3EE" />

    <!-- Forensic Memory Scanner Reticle Cross in Nose -->
    <polygon points="400,355 408,375 392,375" fill="#EF4444" />

    <!-- Teeth / Digital Hash Blocks -->
    <line x1="370" y1="400" x2="370" y2="425" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
    <line x1="390" y1="400" x2="390" y2="425" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
    <line x1="410" y1="400" x2="410" y2="425" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
    <line x1="430" y1="400" x2="430" y2="425" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- BFS Lateral Traversal Incident Nodes -->
  <g fill="#EF4444" filter="url(#subtle-glow)">
    <circle cx="280" cy="270" r="8" />
    <circle cx="520" cy="270" r="8" fill="#10B981" />
    <circle cx="310" cy="480" r="7" />
    <circle cx="490" cy="480" r="7" fill="#10B981" />
  </g>
  <g stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4">
    <line x1="280" y1="270" x2="330" y2="320" />
    <line x1="470" y1="320" x2="520" y2="270" />
  </g>

  <!-- Typography -->
  <text x="400" y="685" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="4">
    PROJECT<tspan fill="#EF4444">AEGIS</tspan>
  </text>
  <text x="400" y="722" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3">
    AUTONOMOUS DFIR FORENSICS COPILOT
  </text>
</svg>
